name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Install Vulkan shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev
          glslc --version
          SPIRV_HEADERS_CMAKE_DIR="$(dirname "$(dpkg -L spirv-headers | grep '/SPIRV-HeadersConfig.cmake

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify unsigned APK
        run: |
          ls -lah app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate test signing key
        env:
          SIGNING_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-LLM-BT-test
        run: |
          bash scripts/generate-test-signing-key.sh

      - name: Sign release APK
        env:
          SIGNING_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-LLM-BT-test
        run: |
          bash scripts/sign-release-apk.sh

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LLM-BT-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
